name: image

# Builds the renderer / updater image and publishes it to GHCR:
#   ghcr.io/toro-server/toro-gpu-renderer:latest and :<commit sha>
on:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "scripts/**"
      - "shaders/**"
      - "docker/**"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/toro-server/toro-gpu-renderer:latest
            ghcr.io/toro-server/toro-gpu-renderer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
